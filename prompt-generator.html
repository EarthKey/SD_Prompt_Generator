<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD Prompt Generator Pro (Custom Batch)</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --text-main: #e0e6ed;
            --text-sub: #94a3b8;
            --accent-start: #6366f1;
            --accent-end: #8b5cf6;
            --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            --border-color: #2d3748;
            --hover-border: #4f46e5;
            --glass-bg: rgba(26, 29, 36, 0.85);
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-glow: 0 0 15px rgba(99, 102, 241, 0.2);
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Header --- */
        header {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-md);
            flex-wrap: wrap;
            /* Allow wrapping on small screens */
            gap: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .header-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Custom Checkbox for Header */
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            user-select: none;
            font-weight: 600;
            color: var(--text-sub);
        }

        input[type="checkbox"] {
            accent-color: var(--accent-start);
            width: 1.2rem;
            height: 1.2rem;
            cursor: pointer;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: white;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--accent-gradient);
            box-shadow: var(--shadow-glow);
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .btn-danger:hover {
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        /* --- Main Content --- */
        main {
            flex: 1;
            padding: 2rem;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            width: 100%;
        }

        @media (min-width: 1600px) {
            .grid-container {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (max-width: 1024px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .grid-container {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                align-items: stretch;
                padding: 1rem;
            }

            h1 {
                text-align: center;
                font-size: 1.25rem;
            }

            .header-controls {
                justify-content: center;
            }
        }

        /* --- Slot Card --- */
        .slot-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            position: relative;
        }

        .slot-card.active {
            border-color: var(--accent-start);
            box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.3);
        }

        .slot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .slot-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
        }

        .slot-number {
            background: #334155;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
        }

        .input-group {
            position: relative;
            flex: 1;
        }

        input[type="text"] {
            width: 100%;
            background: #0f1115;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.6rem;
            color: var(--text-main);
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-start);
        }

        .slot-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.4rem;
        }

        .btn-small {
            padding: 0.4rem;
            border-radius: 6px;
            font-size: 0.9rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-del {
            background: #451a1a;
            color: #fca5a5;
        }

        .btn-del:hover {
            background: #7f1d1d;
        }

        /* --- Footer --- */
        footer {
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
            position: sticky;
            bottom: 0;
            z-index: 90;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.2);
        }

        .prompt-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        textarea {
            width: 100%;
            height: 80px;
            background: #0f1115;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            color: #a5b4fc;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            resize: none;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-gradient);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: var(--shadow-md);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
        }
    </style>
</head>

        function initApp() {
            let index = 1;
            slotConfig.forEach(cfg => {
                const key = cfg.key;
                const data = promptData[key];

                // Datalist options
                const optionsHTML = Object.keys(data).map(opt => `<option value="${opt}">`).join('');

                const html = `
                <div class="slot-card" id="card-${key}">
                    <div class="slot-header">
                        <label class="slot-label">
                            <input type="checkbox" class="slot-check" id="check-${key}" data-key="${key}" checked>

                        <input type="text" list="list-${key}" id="input-${key}" data-key="${key}" placeholder="未設定 (なし)" autocomplete="off">
                        <datalist id="list-${key}">${optionsHTML}</datalist>
                    </div>

                    <div class="slot-controls">
                        <button class="btn-small btn-secondary" onclick="randomizeSlot('${key}')" title="Randomize this slot">🎲 個別</button>
                        <button class="btn-small btn-del" onclick="clearSlot('${key}')" title="Clear this slot">❌ 解除</button>
                        <button class="btn-small btn-secondary" onclick="copySlot('${key}')" title="Copy this slot value">📋 Copy</button>
                    </div>
                </div>
                `;
                slotsGrid.insertAdjacentHTML('beforeend', html);

                // Event Listeners
                const input = document.getElementById(`input-${key}`);
                input.addEventListener('input', updatePrompt);

                // Highlight active card when checked
                const chk = document.getElementById(`check-${key}`);
                chk.addEventListener('change', (e) => {
                    const card = document.getElementById(`card-${key}`);
                    if (e.target.checked) card.classList.add('active');
                    else card.classList.remove('active');
                });
                // Init active state
                document.getElementById(`card-${key}`).classList.add('active');

                index++;
            });

            updatePrompt();
        }

        function updatePrompt() {
            const parts = [PROMPT_PREFIX];

            slotConfig.forEach(cfg => {
                const key = cfg.key;
                const input = document.getElementById(`input-${key}`);

                if (val && val !== "なし") {
                    // Try Mapping
                    const mapped = promptData[key][val];
                    if (mapped !== undefined) {
                        if (mapped !== "") parts.push(mapped);
                    } else {
                        // Custom Input
                        parts.push(val);
                    }
                }
            });

            finalPromptParams.value = parts.join(' ');
        }

        function getRandomValue(key) {
            const data = promptData[key];
            const keys = Object.keys(data).filter(k => k !== "なし");
            const rKey = keys[Math.floor(Math.random() * keys.length)];
            return rKey;
        }

        window.randomizeSlot = function (key) {
            const input = document.getElementById(`input-${key}`);
            input.value = getRandomValue(key);
            updatePrompt();
        };

        window.clearSlot = function (key) {
            const input = document.getElementById(`input-${key}`);
            input.value = "";
            updatePrompt();
        };

        window.copySlot = function (key) {
            const input = document.getElementById(`input-${key}`);
            const val = input.value.trim();
            if (!val || val === "なし") return;
            const mapped = promptData[key][val];
            const text = (mapped !== undefined) ? mapped : val;
            if (text) copyToClipboard(text);
        };

        // Header Controls
        checkAll.addEventListener('change', (e) => {
            const isChecked = e.target.checked;
            document.querySelectorAll('.slot-check').forEach(chk => {
                chk.checked = isChecked;
                // update visual
                const card = document.getElementById(`card-${chk.dataset.key}`);
                if (isChecked) card.classList.add('active');
                else card.classList.remove('active');
            });
        });

        btnRandomSelected.addEventListener('click', () => {
            // Only randomize checked slots
            document.querySelectorAll('.slot-check').forEach(chk => {
                if (chk.checked) {
                    const key = chk.dataset.key;
                    const input = document.getElementById(`input-${key}`);
                    // Note: If you want to randomize even if it has a value, we just overwrite.
                    input.value = getRandomValue(key);
                }
            });
            updatePrompt();
        });

        btnResetAll.addEventListener('click', () => {
            document.querySelectorAll('input[type="text"]').forEach(input => input.value = "");
            updatePrompt();
        });

        btnCopyAll.addEventListener('click', () => {
            copyToClipboard(finalPromptParams.value);
        });

        // --- UTILS ---
        function copyToClipboard(text) {
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                showToast();
            }).catch(() => {
                // fallback
                const ta = document.createElement("textarea");
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
                showToast();
            });
        }

        function showToast() {
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Init
        initApp();

    </script>
</body>

</html>
